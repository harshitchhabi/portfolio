  <path d="M 100 320 Q 220 340 340 280 T 420 150" stroke="#333333" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <circle cx="100" cy="320" r="8" fill="#60A5FA" stroke="#111111" stroke-width="2"/>
  <circle cx="280" cy="240" r="6" fill="#2563EB"/>
  <circle cx="420" cy="150" r="8" fill="#60A5FA" stroke="#111111" stroke-width="2"/>

