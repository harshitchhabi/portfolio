<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <rect width="800" height="450" fill="#111111" rx="8"/>
  <rect x="40" y="40" width="720" height="370" rx="6" stroke="#262626" stroke-width="1.5" fill="#161616"/>
  <line x1="40" y1="80" x2="760" y2="80" stroke="#262626" stroke-width="1.5"/>
  <circle cx="65" cy="60" r="4" fill="#333333"/>
  <circle cx="80" cy="60" r="4" fill="#333333"/>
  <circle cx="95" cy="60" r="4" fill="#333333"/>
  <text x="400" y="64" fill="#666666" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" letter-spacing="1">CRYPTO ENGINE • SHA-256 / AES-256-CBC / RSA-2048</text>

  <!-- Step 1: Input & Hashing -->
  <rect x="70" y="120" width="190" height="240" rx="4" fill="#1A1A1A" stroke="#333333"/>
  <text x="85" y="150" fill="#888888" font-family="monospace" font-size="11">01. INTEGRITY CHECK</text>
  <rect x="85" y="170" width="160" height="50" rx="3" fill="#222222" stroke="#262626"/>
  <text x="95" y="195" fill="#CCCCCC" font-family="monospace" font-size="11">Input File Buffer</text>
  <path d="M165 220 L165 245" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="85" y="250" width="160" height="80" rx="3" fill="#141414" stroke="#2563EB"/>
  <text x="95" y="275" fill="#60A5FA" font-family="monospace" font-size="11">SHA-256 Checksum</text>
  <text x="95" y="300" fill="#888888" font-family="monospace" font-size="9">e3b0c44298fc1c149a...</text>

  <!-- Step 2: AES-256 Payload Encryption -->
  <rect x="305" y="120" width="190" height="240" rx="4" fill="#1A1A1A" stroke="#333333"/>
  <text x="320" y="150" fill="#888888" font-family="monospace" font-size="11">02. SYMMETRIC ENCRYPT</text>
  <rect x="320" y="170" width="160" height="50" rx="3" fill="#222222" stroke="#262626"/>
  <text x="330" y="195" fill="#CCCCCC" font-family="monospace" font-size="11">AES-256-CBC Cipher</text>
  <rect x="320" y="250" width="160" height="80" rx="3" fill="#141414" stroke="#333333"/>
  <text x="330" y="275" fill="#888888" font-family="monospace" font-size="11">IV + Encrypted Blob</text>
  <text x="330" y="300" fill="#666666" font-family="monospace" font-size="9">Session-scoped Storage</text>

  <!-- Step 3: RSA Key Exchange -->
  <rect x="540" y="120" width="190" height="240" rx="4" fill="#1A1A1A" stroke="#333333"/>
  <text x="555" y="150" fill="#888888" font-family="monospace" font-size="11">03. RSA KEY EXCHANGE</text>
  <rect x="555" y="170" width="160" height="50" rx="3" fill="#222222" stroke="#262626"/>
  <text x="565" y="195" fill="#CCCCCC" font-family="monospace" font-size="11">RSA 2048 Keypair</text>
  <rect x="555" y="250" width="160" height="80" rx="3" fill="#141414" stroke="#2563EB"/>
  <text x="565" y="275" fill="#60A5FA" font-family="monospace" font-size="11">Secured Key Payload</text>
  <text x="565" y="300" fill="#888888" font-family="monospace" font-size="9">Protected Download</text>
</svg>
